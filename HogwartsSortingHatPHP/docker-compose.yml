version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: .docker/php/Dockerfile
    image: hshp-app
    container_name: hshp-app
    volumes:
      - .:/var/www
    networks:
      - hshp

  web:
    image: nginx:alpine
    container_name: hshp-nginx
    ports:
      - "8002:80"
    volumes:
      - .:/var/www
      - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - hshp

  db:
    image: mysql:8.0
    container_name: hshp-mysql
    ports:
      - "3308:3306"
    environment:
      MYSQL_DATABASE: hshp_db
      MYSQL_ROOT_PASSWORD: root
      MYSQL_PASSWORD: root
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - hshp

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: hshp-phpmyadmin
    restart: always
    ports:
      - "8082:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root
    depends_on:
      - db
    networks:
      - hshp

volumes:
  dbdata:

networks:
  hshp:
    driver: bridge